name: Auto Sync Upstream

on:
  schedule:
    # Executa todos os dias à meia-noite (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite rodar manualmente a qualquer momento

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sincronizar Fork via API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_SYNC_TOKEN }}
          script: |
            try {
              const response = await github.rest.repos.mergeUpstream({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'master',
              });
              console.log('Sincronização concluída com sucesso:', response.data);
            } catch (error) {
              // Se não houver nada para sincronizar (já atualizado), avisa no log
              console.log('Aviso/Erro na sincronização:', error.message);
            }

      - name: Disparar Workflow de Build
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_SYNC_TOKEN }}
          script: |
            try {
              // Procura o arquivo de workflow do build (build.yml ou similar)
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'build.yml', // Nome do arquivo YAML do build no repositório
                ref: 'master',
              });
              console.log('Workflow de Build disparado com sucesso!');
            } catch (error) {
              console.error('Erro ao disparar o build:', error.message);
              core.setFailed(error.message);
            }
