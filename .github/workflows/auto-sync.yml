name: Auto Sync Upstream

on:
  schedule:
    # Executa todos os dias à meia-noite (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite rodar manualmente

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Sincronizar Fork via API do GitHub
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const response = await github.rest.repos.mergeUpstream({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'master',
              });
              console.log('Sincronização concluída com sucesso:', response.data);
            } catch (error) {
              console.error('Erro ao sincronizar:', error.message);
              core.setFailed(error.message);
            }
